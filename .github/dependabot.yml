version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Stay on Node 22 types, the oldest major vitest accepts; runtime support for Node 20 is covered by the CI matrix.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directories: [/, /action]
    schedule:
      interval: monthly
